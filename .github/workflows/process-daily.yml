name: Process Malware Packages

on:
  schedule:
    # Run hourly (at minute 0 UTC)
    - cron: '0 * * * *'
  workflow_dispatch: # Allow manual trigger

concurrency:
  group: process-malware-packages
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync to latest main
        run: git pull --ff-only origin main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Process OSSF malicious-packages
        run: npm run process

      - name: Validate output (manifest hashes, counts, ordering)
        run: npm run validate

      - name: Commit and push output
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add malicious-packages/
          if git diff --staged --quiet; then
            echo "No changes to commit"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: update malware packages $(date -u +%Y-%m-%dT%H:%MZ)"
            echo "changed=true" >> "$GITHUB_OUTPUT"
            for attempt in 1 2 3 4 5; do
              if git pull --rebase origin main && git push origin main; then
                break
              fi
              if [ "$attempt" -eq 5 ]; then
                echo "git push failed after ${attempt} attempts"
                exit 1
              fi
              echo "Push rejected; rebasing onto origin/main (attempt ${attempt}/5)..."
              sleep $((attempt * 5))
            done
          fi

      - name: Publish malicious-packages.tar.gz release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          retry_gh() {
            local attempt delay=15
            for attempt in 1 2 3 4 5; do
              if "$@"; then
                return 0
              fi
              if [ "$attempt" -eq 5 ]; then
                return 1
              fi
              echo "gh command failed (attempt ${attempt}/5); retrying in ${delay}s..."
              sleep "$delay"
              delay=$((delay * 2))
            done
          }

          generated=$(jq -r .generated_at malicious-packages/manifest.json)
          records=$(jq -r .total_records malicious-packages/manifest.json)
          title="Malicious packages ${generated}"
          tag="feed-$(date -u -d "$generated" +%Y%m%dT%H%M%SZ)"

          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release ${tag} already exists"
            exit 0
          fi

          tar -czf malicious-packages.tar.gz malicious-packages
          retry_gh gh release create "$tag" malicious-packages.tar.gz \
            --title "$title" \
            --latest \
            --notes "Snapshot of malicious-packages/ at generated_at=${generated} (${records} packages). Extracting creates the malicious-packages/ directory. Incremental clients should use manifest.json and the changes files instead of downloading this archive on every sync."

      - name: Delete feed releases older than 5 days
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cutoff=$(date -u -d '5 days ago' +%Y-%m-%dT%H:%M:%SZ)
          # Keep the newest feed release even if it is older than the cutoff, so
          # releases/latest/download/malicious-packages.tar.gz keeps resolving.
          gh release list --limit 200 --json tagName,publishedAt \
            | jq -r --arg cutoff "$cutoff" '
                [ .[] | select(.tagName | startswith("feed-")) ]
                | sort_by(.publishedAt) | reverse
                | .[1:]
                | .[]
                | select(.publishedAt < $cutoff)
                | .tagName
              ' \
            | while read -r tag; do
                echo "Deleting $tag"
                gh release delete "$tag" --yes --cleanup-tag
              done
